<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07070b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="MVPoisk" />
  <meta name="description" content="MVPoisk — поиск фильмов и сериалов, рейтинги, отзывы и информация о кино." />
  <title>MVPoisk — фильмы и сериалы</title>
  <link rel="preconnect" href="https://mvpoisk.cizikvpn.workers.dev" crossorigin>
  <link rel="stylesheet" href="styles.css?v=21" />
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <header class="site-header">
    <a class="brand" href="./" aria-label="MVPoisk — на главную">
      <img class="brand-logo" src="icons/logo-mark-64.png" alt="" width="34" height="34" /><span class="brand-word"><span class="brand-mvp">MVP</span><span>oisk</span></span>
    </a>
    <nav class="nav">
      <a href="#discover">Фильмы</a>
      <button class="nav-link" type="button" data-quick-filter="series">Сериалы</button>
      <button class="nav-link" type="button" data-quick-filter="top">Топ</button>
      <a class="nav-saved" href="my.html">Моё <span class="nav-count" data-list-count hidden>0</span></a>
      <button class="nav-link nav-profile" type="button" data-profile-open>Профиль</button>
      <button class="nav-link nav-install" type="button" data-install-button hidden>Установить</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-badge">Фильмы • сериалы • рейтинги • отзывы</div>
      <h1>Найди, что посмотреть <span>сегодня</span></h1>
      <p>Ищи кино по названию или отфильтруй каталог по жанру, году и рейтингу.</p>

      <div class="search-area">
        <form class="search-shell" id="searchForm" autocomplete="off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65A8 8 0 1 1 3 11a8 8 0 0 1 16 0Z"/></svg>
          <input id="searchInput" type="search" placeholder="Название фильма или сериала" aria-label="Поиск фильма" />
          <button type="submit">Найти</button>
        </form>
        <div class="suggestions" id="suggestions" hidden></div>
      </div>

      <div class="hero-chips" aria-label="Быстрые запросы">
        <button type="button" data-search="Интерстеллар">Интерстеллар</button>
        <button type="button" data-search="Дюна">Дюна</button>
        <button type="button" data-search="Брат">Брат</button>
        <button type="button" data-search="Во все тяжкие">Во все тяжкие</button>
      </div>
    </section>

    <section class="catalog" id="discover">
      <div class="section-heading">
        <div>
          <span class="eyebrow">Каталог</span>
          <h2 id="catalogTitle">Популярное кино</h2>
        </div>
        <span class="result-count" id="resultCount"></span>
      </div>

      <form class="filters" id="filterForm">
        <label>
          <span>Тип</span>
          <select id="typeFilter">
            <option value="all">Всё</option>
            <option value="movie">Фильмы</option>
            <option value="series">Сериалы</option>
          </select>
        </label>
        <label>
          <span>Жанр</span>
          <select id="genreFilter">
            <option value="">Все жанры</option>
            <option>драма</option>
            <option>комедия</option>
            <option>триллер</option>
            <option>боевик</option>
            <option>фантастика</option>
            <option>фэнтези</option>
            <option>криминал</option>
            <option>детектив</option>
            <option>ужасы</option>
            <option>мелодрама</option>
            <option>приключения</option>
            <option>мультфильм</option>
            <option>аниме</option>
          </select>
        </label>
        <label>
          <span>Год от</span>
          <input id="yearFilter" type="number" min="1890" max="2035" placeholder="2010" />
        </label>
        <label>
          <span>Рейтинг от</span>
          <select id="ratingFilter">
            <option value="">Любой</option>
            <option value="6">6+</option>
            <option value="7">7+</option>
            <option value="8">8+</option>
            <option value="9">9+</option>
          </select>
        </label>
        <button class="filter-submit" type="submit">Применить</button>
        <button class="filter-reset" type="button" id="resetFilters">Сбросить</button>
      </form>

      <div class="notice" id="statusNotice" hidden></div>
      <div class="movie-grid" id="movieGrid" aria-live="polite"></div>

      <div class="pagination" id="pagination" hidden aria-label="Навигация по страницам">
        <button type="button" id="firstPage" class="pagination-edge" title="Первая страница">« В начало</button>
        <button type="button" id="prevPage">← Назад</button>
        <div class="pagination-pages" id="paginationPages" aria-label="Номера страниц"></div>
        <span id="pageIndicator" class="page-indicator">1 / 1</span>
        <button type="button" id="nextPage">Вперёд →</button>
        <button type="button" id="lastPage" class="pagination-edge" title="Последняя страница">В конец »</button>
      </div>
    </section>
  </main>

  <footer>
    <a class="brand brand-small" href="./"><img class="brand-logo" src="icons/logo-mark-64.png" alt="" width="34" height="34" /><span class="brand-word"><span class="brand-mvp">MVP</span><span>oisk</span></span></a>
    <p>Информация о кино предоставляется через ПоискКино API.</p>
  </footer>

  <script type="module" src="js/common.js?v=21"></script>
  <script type="module" src="js/app.js?v=21"></script>
</body>
</html>
