<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (() => {
      const q = new URLSearchParams(location.search);
      if (q.get('tv') === '1' || /MVPoiskTV\/[\d.]+|Android TV|GoogleTV/i.test(navigator.userAgent || '')) {
        document.documentElement.classList.add('tv-mode');
      }
    })();
  </script>
  <meta name="theme-color" content="#07070b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="MVPoisk" />
  <title>Фильм — MVPoisk</title>
  <link rel="stylesheet" href="styles.css?v=34" />
</head>
<body class="movie-page">
  <header class="site-header movie-header">
    <a class="brand" href="./" aria-label="MVPoisk — на главную"><img class="brand-logo" src="icons/logo-mark-64.png" alt="" width="34" height="34" /><span class="brand-word"><span class="brand-mvp">MVP</span><span>oisk</span></span></a>
    <div class="movie-header-tools">
      <a class="back-link" href="./">← К каталогу</a>
      <a class="back-link" href="my.html">Моё <span class="nav-count" data-list-count hidden>0</span></a>
      <button class="nav-link nav-profile" type="button" data-profile-open>Профиль</button>
      <button class="nav-link nav-install" type="button" data-install-button hidden>Установить</button>
    </div>
  </header>

  <main id="movieRoot">
    <div class="movie-loader" id="movieLoader">
      <div class="spinner"></div>
      <span>Загружаем фильм…</span>
    </div>
  </main>

  <footer>
    <a class="brand brand-small" href="./"><img class="brand-logo" src="icons/logo-mark-64.png" alt="" width="34" height="34" /><span class="brand-word"><span class="brand-mvp">MVP</span><span>oisk</span></span></a>
    <p>Информация о кино предоставляется через ПоискКино API.</p>
  </footer>

  <script type="module" src="js/tv.js?v=34"></script>
  <script type="module" src="js/common.js?v=34"></script>
  <script type="module" src="js/movie.js?v=34"></script>
</body>
</html>
